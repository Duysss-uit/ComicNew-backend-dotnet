openapi: 3.0.1
info:
  title: ComicNew API
  version: 1.0.0
  description: |
    Tài liệu OpenAPI mô tả các endpoint chính của ComicNew API để tích hợp frontend dễ dàng.
    
    Luồng đăng nhập (tóm tắt):
    1. Frontend nhận token (JWT) từ Supabase.
    2. Frontend gửi token trong header `Authorization: Bearer <token>` tới API.
    3. API dùng JwtBearer middleware để xác thực token và gọi `OnTokenValidated` để đồng bộ user vào DB.
    4. Sau xác thực, các endpoint bảo vệ bằng `Authorize` có thể truy cập `HttpContext.User` để lấy claims.

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Author:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        FullName:
          type: string
          nullable: true
        AvatarUrl:
          type: string
          nullable: true
    Story:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        Title:
          type: string
        Description:
          type: string
        CoverUrl:
          type: string
        Tags:
          type: array
          items:
            type: string
        Status:
          type: string
          enum: [Ongoing, Completed, Suspended]
          description: Trạng thái của truyện (StoryStatus)
        Views:
          type: integer
          format: int32
        Rating:
          type: number
          format: double
        LastChapterAt:
          type: string
          format: date-time
        Type:
          type: string
          enum: [Comic, Novel]
          description: Thể loại truyện (StoryType)
        Author:
          $ref: '#/components/schemas/Author'
    Chapter:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time
        Title:
          type: string
        ChapterNumber:
          type: integer
          format: int32
        ImageUrls:
          type: array
          items:
            type: string
        Views:
          type: integer
          format: int32
        PublishedAt:
          type: string
          format: date-time
        StoryId:
          type: string
          format: uuid
        Story:
          $ref: '#/components/schemas/Story'
        Content:
          type: string
          nullable: true
    CreateStoryForm:
      type: object
      required:
        - Title
      properties:
        Title:
          type: string
          example: One Piece
        Description:
          type: string
          example: Hành trình của Luffy đi tìm kho báu One Piece.
        Tags:
          type: array
          items:
            type: string
          example: ["shonen", "adventure", "pirate"]
        Type:
          type: string
          enum: [Comic, Novel]
          example: Comic
        Status:
          type: string
          enum: [Ongoing, Completed, Suspended]
          example: Ongoing
        coverFile:
          type: string
          format: binary
          description: File cover tuỳ chọn; backend sẽ upload và gán CoverUrl.
    CreateChapterForm:
      type: object
      required:
        - Title
        - ChapterNumber
      properties:
        Title:
          type: string
          example: Chapter 1
        ChapterNumber:
          type: integer
          format: int32
          example: 1
        StoryId:
          type: string
          format: uuid
          description: ID của truyện (nếu gửi qua form phải khớp với storyId trên path, hoặc để trống).
        files:
          type: array
          items:
            type: string
            format: binary
          description: Danh sách file trang truyện; backend upload và sinh ImageUrls/Content.
    AddReadingHistoryRequest:
      type: object
      required:
        - StoryId
        - ChapterNumber
      properties:
        StoryId:
          type: string
          format: uuid
        ChapterNumber:
          type: integer
          format: int32
    ReadingHistoryResponse:
      type: object
      properties:
        UserId:
          type: string
          format: uuid
        ChapterNumber:
          type: integer
          format: int32
        LastReadAt:
          type: string
          format: date-time
        Story:
          $ref: '#/components/schemas/Story'

paths:
  /api/auth/me:
    get:
      summary: Lấy thông tin user hiện tại
      description: |
        Endpoint xác thực token Supabase, đồng bộ user vào DB, rồi trả thông tin profile hiện tại.
        Frontend phải gửi header `Authorization: Bearer <token>`.

        Ví dụ fetch từ frontend:

        ```js
        const res = await fetch('/api/auth/me', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Auth failed');
        const me = await res.json();
        console.log(me);
        ```
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin user hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  UserId:
                    type: string
                    description: Supabase user id (claim `sub`)
                  Email:
                    type: string
                    nullable: true
                  Role:
                    type: string
                    nullable: true
                  Name:
                    type: string
                  AvatarUrl:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized — token missing, invalid, or does not contain a valid user id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/stories:
    get:
      summary: Lấy danh sách truyện
      description: Trả về danh sách truyện theo phân trang `page` và `pageSize`.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Trang hiện tại
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Số phần tử mỗi trang
      responses:
        '200':
          description: Danh sách truyện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Story'
        '500':
          description: Lỗi server khi lấy danh sách truyện
    post:
      summary: Tạo truyện mới
      description: |
        Endpoint tạo truyện mới, yêu cầu đăng nhập. Gửi dưới dạng `multipart/form-data`.

        Frontend truyền `Title`, `Description`, `Tags`, `Type`, `Status` (trong request body form) và có thể kèm `coverFile` dưới dạng binary.
        Backend sẽ upload `coverFile` lên storage nếu có và tự gán `CoverUrl`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateStoryForm'
      responses:
        '201':
          description: Truyện đã được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '401':
          description: Unauthorized — token missing hoặc invalid
        '500':
          description: Lỗi server khi tạo truyện

  /api/stories/{storyId}:
    get:
      summary: Lấy chi tiết truyện
      description: Trả về thông tin truyện theo `storyId`.
      parameters:
        - in: path
          name: storyId
          required: true
          schema:
            type: string
            format: uuid
          description: Id của truyện
      responses:
        '200':
          description: Chi tiết truyện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '404':
          description: Không tìm thấy truyện
        '500':
          description: Lỗi server khi lấy truyện

  /api/stories/author/{authorId}:
    get:
      summary: Lấy danh sách truyện của tác giả
      description: Trả về danh sách truyện được tạo bởi một tác giả cụ thể theo `authorId`.
      parameters:
        - in: path
          name: authorId
          required: true
          schema:
            type: string
            format: uuid
          description: ID của tác giả
      responses:
        '200':
          description: Danh sách truyện của tác giả
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Story'
        '404':
          description: Không tìm thấy truyện hoặc tác giả
        '500':
          description: Lỗi server khi lấy danh sách truyện

  /api/stories/{storyId}/chapters:
    get:
      summary: Lấy danh sách chapter theo truyện
      description: Trả về danh sách chapter của truyện.
      operationId: GetChaptersByStory
      parameters:
        - in: path
          name: storyId
          required: true
          schema:
            type: string
            format: uuid
          description: Story id từ base route `api/stories/{storyId}/chapters`.
      responses:
        '200':
          description: Danh sách chapter của truyện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
        '500':
          description: Lỗi server khi lấy danh sách chapter
    post:
      summary: Upload chapter mới cho truyện
      description: |
        Endpoint upload chapter, yêu cầu đăng nhập. Gửi dưới dạng `multipart/form-data`.

        Luồng xử lý trong controller:
        1. Đồng bộ/lấy user hiện tại từ token.
        2. Dùng `storyId` trên URL làm nguồn sự thật cho truyện.
        3. Kiểm tra quyền author (chỉ tác giả truyện mới được đăng chapter).
        4. Upload file trang truyện và tạo chapter.
      operationId: UploadChapter
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: storyId
          required: true
          schema:
            type: string
            format: uuid
          description: Id truyện trên URL.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateChapterForm'
      responses:
        '201':
          description: Chapter đã được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          description: Yêu cầu không hợp lệ (ví dụ StoryId trong form không khớp với URL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized — token missing hoặc invalid
        '403':
          description: Người dùng không có quyền upload chapter cho truyện này (không phải tác giả)
        '404':
          description: Không tìm thấy truyện
        '500':
          description: Lỗi server khi upload chapter

  /api/stories/{storyId}/chapters/{chapterId}:
    get:
      summary: Lấy chi tiết chapter
      description: Trả về thông tin chapter theo `chapterId`.
      operationId: GetChapter
      parameters:
        - in: path
          name: storyId
          required: true
          schema:
            type: string
            format: uuid
          description: Id truyện trên URL gốc.
        - in: path
          name: chapterId
          required: true
          schema:
            type: string
            format: uuid
          description: Id chapter.
      responses:
        '200':
          description: Chi tiết chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '404':
          description: Không tìm thấy chapter hoặc truyện
        '500':
          description: Lỗi server khi lấy chapter
    delete:
      summary: Xoá chapter
      description: Xoá chapter theo `chapterId`. Yêu cầu đăng nhập và chỉ tác giả của truyện mới được xoá.
      operationId: DeleteChapter
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: storyId
          required: true
          schema:
            type: string
            format: uuid
          description: Id truyện trên URL gốc.
        - in: path
          name: chapterId
          required: true
          schema:
            type: string
            format: uuid
          description: Id chapter.
      responses:
        '204':
          description: Chapter đã được xoá thành công
        '401':
          description: Unauthorized — token missing hoặc invalid
        '403':
          description: Người dùng không có quyền xoá chapter này (không phải tác giả)
        '404':
          description: Không tìm thấy chapter hoặc truyện
        '500':
          description: Lỗi server khi xoá chapter

  /api/user/reading-history:
    post:
      summary: Thêm hoặc cập nhật lịch sử đọc
      description: |
        Thêm hoặc cập nhật lịch sử đọc của người dùng đối với một chương truyện nhất định.
        Yêu cầu đăng nhập.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReadingHistoryRequest'
      responses:
        '200':
          description: Đã lưu lịch sử đọc thành công
        '401':
          description: Unauthorized — token missing hoặc invalid
        '500':
          description: Lỗi server khi thêm lịch sử đọc

  /api/user/reading-history:
    get:
      summary: Lấy lịch sử đọc của người dùng
      description: Trả về danh sách lịch sử đọc của người dùng hiện tại dựa trên JWT token. Yêu cầu đăng nhập.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách lịch sử đọc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingHistoryResponse'
        '401':
          description: Unauthorized — token missing hoặc invalid
        '500':
          description: Lỗi server khi lấy lịch sử đọc

  /api/health:
    get:
      summary: Health check
      description: Trả trạng thái ứng dụng (public)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string

# Notes
x-notes: |
  - Middleware JwtBearer lấy metadata từ Supabase (`Supabase:Url`) để xác thực token.
  - `OnTokenValidated` trong `Program.cs` gọi `IUserSyncService.GetOrCreateUserAsync` để đảm bảo user tồn tại trong DB.
  - Nếu bạn muốn chặn request khi sync user thất bại: trong `OnTokenValidated` gọi `context.Fail("reason")`.
  - `POST /api/stories` nhận multipart form; `coverFile` là tuỳ chọn.
  - `POST /api/stories/{storyId}/chapters` cần `Title`, `ChapterNumber`, `StoryId` (tuỳ chọn) và danh sách file trang truyện trong field `files`.
  - `storyId` trên URL là nguồn sự thật cho chapter routes; form body nếu có `StoryId` sẽ được kiểm tra khớp với route.
