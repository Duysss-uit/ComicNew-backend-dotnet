openapi: 3.0.1
info:
  title: ComicNew API
  version: 1.0.0
  description: |
    Tài liệu OpenAPI mô tả các endpoint chính của ComicNew API để tích hợp frontend dễ dàng.
    
    Luồng đăng nhập (tóm tắt):
    1. Frontend nhận token (JWT) từ Supabase.
    2. Frontend gửi token trong header `Authorization: Bearer <token>` tới API.
    3. API dùng JwtBearer middleware để xác thực token và gọi `OnTokenValidated` để đồng bộ user vào DB.
    4. Sau xác thực, các endpoint bảo vệ bằng `Authorize` có thể truy cập `HttpContext.User` để lấy claims.

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/auth/me:
    get:
      summary: Lấy thông tin user hiện tại (từ claims)
      description: |
        Endpoint trả thông tin user dựa trên token (claims). Frontend phải gửi header `Authorization: Bearer <token>`.
        Nếu muốn dữ liệu profile đầy đủ (từ DB) có thể mở rộng endpoint để truy vấn bản ghi user.

        Ví dụ fetch từ frontend:

        ```js
        const res = await fetch('/api/auth/me', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Auth failed');
        const me = await res.json();
        console.log(me);
        ```
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin user hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  UserId:
                    type: string
                    description: Supabase user id (claim `sub`)
                  Email:
                    type: string
                    nullable: true
                  Role:
                    type: string
                    nullable: true
                  Claims:
                    type: array
                    items:
                      type: object
                      properties:
                        Type:
                          type: string
                        Value:
                          type: string
        '401':
          description: Unauthorized — token missing or invalid

  /api/health:
    get:
      summary: Health check
      description: Trả trạng thái ứng dụng (public)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string

# Notes
x-notes: |
  - Middleware JwtBearer lấy metadata từ Supabase (`Supabase:Url`) để xác thực token.
  - `OnTokenValidated` trong `Program.cs` gọi `IUserSyncService.GetOrCreateUserAsync` để đảm bảo user tồn tại trong DB.
  - Nếu bạn muốn chặn request khi sync user thất bại: trong `OnTokenValidated` gọi `context.Fail("reason")`.
